# Bixis compositor config
# Copy to ~/.config/bixis/config and edit. Reload with mod+shift+r or `pkill -HUP bixis`.

# Main modifier for bindings: super, alt, ctrl or shift
mod = super
# Slot shown (and launched) at startup; empty = none
start = terminal

[keyboard]
layout = us,ru
variant =
options = grp:alt_shift_toggle
repeat_rate = 35
repeat_delay = 250

[output]
# auto: 200% on 4K and dense laptop screens, else 100%. Or a number: 1, 1.5, 2
scale = auto
# auto: monitor's native resolution at its highest refresh rate. Or e.g. 3840x2160@60
mode = auto
background = #161616

# Slots: one fullscreen app each. A window lands in a slot by app_id,
# otherwise by the pid of the launched command.
[slot terminal]
exec = bixis-term
app_id = bixis-term

[slot browser]
exec = firefox
app_id = firefox

[slot messenger]
exec = telegram-desktop
app_id = org.telegram.desktop

[slot video]
exec = mpv --idle --force-window
app_id = mpv

# Bindings: keys are matched by their Latin symbol, so they work in any layout.
# Actions: slot <name>, spawn <command>, close, cycle, reload, exit
[bindings]
mod+1 = slot terminal
mod+2 = slot browser
mod+3 = slot messenger
mod+4 = slot video
mod+q = close
mod+tab = cycle
mod+shift+r = reload
mod+shift+e = exit
